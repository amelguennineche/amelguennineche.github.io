<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="cache-control" content="no-store">
    <title>Administration | Beyond SINAI</title>
    <style>
        :root {
            color-scheme: light;
        }
        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: #fafaf9;
            color: #1a1a1a;
        }
        main {
            max-width: 72rem;
            margin: 4rem auto;
            padding: 0 1.5rem 3rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            line-height: 1.5;
        }
        .status {
            min-height: 1.4em;
            color: #5a5a5a;
        }
        .error {
            color: #c0392b;
        }
        button {
            margin-top: 1.25rem;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            border: 0;
            border-radius: 12px;
            background: #006994;
            color: #fff;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }
        button:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(0, 105, 148, 0.35);
            outline-offset: 2px;
        }
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
            gap: 0.85rem 1rem;
            margin: 1.25rem 0 0.5rem;
            padding: 1rem;
            background: #fff;
            border: 1px solid #e0ddd8;
            border-radius: 12px;
        }
        .filters label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
        }
        .filters input,
        .filters select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 0.65rem;
            font-size: 1rem;
            border: 1px solid #e0ddd8;
            border-radius: 8px;
            background: #fff;
        }
        .table-wrap {
            margin-top: 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #e0ddd8;
            border-radius: 12px;
            background: #fff;
        }
        table {
            width: 100%;
            min-width: 64rem;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        caption {
            text-align: left;
            padding: 0.75rem 0.85rem;
            font-weight: 600;
        }
        th, td {
            text-align: left;
            vertical-align: top;
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid #e0ddd8;
            white-space: pre-wrap;
            word-break: break-word;
        }
        th {
            font-weight: 600;
            background: #f3f1ee;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tbody tr:nth-child(even) {
            background: #fafaf9;
        }
        .status-cell {
            white-space: nowrap;
        }
        .status-select {
            display: block;
            min-width: 10rem;
            padding: 0.4rem 0.5rem;
            font-size: 0.9rem;
            border: 1px solid #e0ddd8;
            border-radius: 8px;
            background: #fff;
        }
        .row-action {
            margin-top: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
        .message-cell {
            max-width: 16rem;
            max-height: 6.5rem;
            overflow: auto;
        }
        @media (max-width: 640px) {
            main {
                margin: 1.5rem auto;
                padding: 0 1rem 2rem;
            }
            .filters {
                grid-template-columns: 1fr;
            }
            table {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Administration</h1>
        <p>You are signed in. Booking requests are listed below.</p>
        <form id="filters" class="filters" hidden>
            <div>
                <label for="filter-search">Search name or email</label>
                <input id="filter-search" type="search" autocomplete="off" spellcheck="false">
            </div>
            <div>
                <label for="filter-status">Status</label>
                <select id="filter-status">
                    <option value="all">All</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div>
                <label for="filter-date-field">Date field</label>
                <select id="filter-date-field">
                    <option value="preferredDate">Preferred date</option>
                    <option value="createdAt">Created date</option>
                </select>
            </div>
            <div>
                <label for="filter-date">Date</label>
                <input id="filter-date" type="date">
            </div>
        </form>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div id="bookings" class="table-wrap" hidden></div>
        <button type="button" id="logout">Sign out</button>
    </main>
    <script>
        (function () {
            var status = document.getElementById('status');
            var list = document.getElementById('bookings');
            var logout = document.getElementById('logout');
            var filtersForm = document.getElementById('filters');
            var searchInput = document.getElementById('filter-search');
            var statusFilter = document.getElementById('filter-status');
            var dateFieldFilter = document.getElementById('filter-date-field');
            var dateFilter = document.getElementById('filter-date');
            var allBookings = [];
            var statusOptions = [
                { value: 'pending', label: 'Pending' },
                { value: 'confirmed', label: 'Confirmed' },
                { value: 'cancelled', label: 'Cancelled' }
            ];
            var columns = [
                { key: 'id', label: 'ID' },
                { key: 'createdAt', label: 'Created' },
                { key: 'status', label: 'Status' },
                { key: 'fullname', label: 'Name' },
                { key: 'email', label: 'Email' },
                { key: 'phone', label: 'Phone' },
                { key: 'country', label: 'Country' },
                { key: 'trip', label: 'Trip' },
                { key: 'tripType', label: 'Type' },
                { key: 'preferredDate', label: 'Preferred date' },
                { key: 'participants', label: 'Participants' },
                { key: 'divers', label: 'Divers' },
                { key: 'certificationLevel', label: 'Certification' },
                { key: 'loggedDives', label: 'Logged dives' },
                { key: 'message', label: 'Message' }
            ];

            function setStatus(message, isError) {
                if (!status) return;
                status.textContent = message;
                status.className = isError ? 'status error' : 'status';
            }

            function displayValue(value) {
                if (value == null || value === '') return '—';
                return String(value);
            }

            function addTextCell(parent, value, isHeader, className) {
                var cell = document.createElement(isHeader ? 'th' : 'td');
                cell.textContent = value;
                if (className) cell.className = className;
                parent.appendChild(cell);
                return cell;
            }

            function allowedStatus(value) {
                var i;
                for (i = 0; i < statusOptions.length; i++) {
                    if (statusOptions[i].value === value) return value;
                }
                return 'pending';
            }

            function bookingDay(value) {
                if (value == null || value === '') return '';
                return String(value).slice(0, 10);
            }

            function matchesFilters(booking) {
                var query = searchInput && searchInput.value
                    ? searchInput.value.trim().toLowerCase()
                    : '';
                if (query) {
                    var name = String(booking.fullname || '').toLowerCase();
                    var email = String(booking.email || '').toLowerCase();
                    if (name.indexOf(query) === -1 && email.indexOf(query) === -1) {
                        return false;
                    }
                }
                var selectedStatus = statusFilter ? statusFilter.value : 'all';
                if (selectedStatus && selectedStatus !== 'all' && booking.status !== selectedStatus) {
                    return false;
                }
                var selectedDate = dateFilter ? dateFilter.value : '';
                if (selectedDate) {
                    var field = dateFieldFilter && dateFieldFilter.value === 'createdAt'
                        ? 'createdAt'
                        : 'preferredDate';
                    if (bookingDay(booking[field]) !== selectedDate) {
                        return false;
                    }
                }
                return true;
            }

            function filteredBookings() {
                var result = [];
                var i;
                for (i = 0; i < allBookings.length; i++) {
                    if (matchesFilters(allBookings[i])) {
                        result.push(allBookings[i]);
                    }
                }
                return result;
            }

            function addStatusCell(parent, booking) {
                var cell = document.createElement('td');
                cell.className = 'status-cell';
                var select = document.createElement('select');
                select.className = 'status-select';
                select.setAttribute('aria-label', 'Status for booking ' + String(booking.id));
                var current = allowedStatus(booking.status);
                var i;
                for (i = 0; i < statusOptions.length; i++) {
                    var option = document.createElement('option');
                    option.value = statusOptions[i].value;
                    option.textContent = statusOptions[i].label;
                    if (statusOptions[i].value === current) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                }
                select.value = current;
                var save = document.createElement('button');
                save.type = 'button';
                save.className = 'row-action';
                save.textContent = 'Save';
                save.addEventListener('click', function () {
                    saveBookingStatus(booking.id, select, save);
                });
                cell.appendChild(select);
                cell.appendChild(save);
                parent.appendChild(cell);
            }

            function renderBookings(bookings) {
                if (!list) return;
                while (list.firstChild) {
                    list.removeChild(list.firstChild);
                }
                if (!bookings.length) {
                    list.hidden = true;
                    return;
                }

                var table = document.createElement('table');
                var caption = document.createElement('caption');
                caption.textContent = 'Booking requests';
                table.appendChild(caption);

                var thead = document.createElement('thead');
                var headRow = document.createElement('tr');
                var i;
                for (i = 0; i < columns.length; i++) {
                    addTextCell(headRow, columns[i].label, true);
                }
                thead.appendChild(headRow);
                table.appendChild(thead);

                var tbody = document.createElement('tbody');
                var rowIndex;
                for (rowIndex = 0; rowIndex < bookings.length; rowIndex++) {
                    var booking = bookings[rowIndex] || {};
                    var tr = document.createElement('tr');
                    for (i = 0; i < columns.length; i++) {
                        if (columns[i].key === 'status') {
                            addStatusCell(tr, booking);
                        } else {
                            addTextCell(
                                tr,
                                displayValue(booking[columns[i].key]),
                                false,
                                columns[i].key === 'message' ? 'message-cell' : ''
                            );
                        }
                    }
                    tbody.appendChild(tr);
                }
                table.appendChild(tbody);
                list.appendChild(table);
                list.hidden = false;
            }

            function applyFilters() {
                if (!allBookings.length) {
                    renderBookings([]);
                    setStatus('No booking requests yet.');
                    return;
                }
                var visible = filteredBookings();
                renderBookings(visible);
                if (!visible.length) {
                    setStatus('No booking requests match these filters.');
                    return;
                }
                if (visible.length === allBookings.length) {
                    setStatus('Showing ' + String(visible.length) + ' booking request' + (visible.length === 1 ? '.' : 's.'));
                    return;
                }
                setStatus('Showing ' + String(visible.length) + ' of ' + String(allBookings.length) + ' booking requests.');
            }

            function loadBookings(successMessage) {
                if (!successMessage) {
                    setStatus('Loading bookings…');
                    if (list) list.hidden = true;
                }
                return fetch('/api/admin/bookings', {
                    method: 'GET',
                    credentials: 'same-origin'
                }).then(function (res) {
                    if (res.status === 401) {
                        window.location.replace('/admin');
                        return null;
                    }
                    if (!res.ok) {
                        throw new Error('load-failed');
                    }
                    return res.json();
                }).then(function (data) {
                    if (!data) return;
                    if (!data.ok || !Array.isArray(data.bookings)) {
                        throw new Error('load-failed');
                    }
                    allBookings = data.bookings;
                    if (filtersForm) filtersForm.hidden = false;
                    applyFilters();
                    if (successMessage) {
                        setStatus(successMessage);
                    }
                }).catch(function () {
                    allBookings = [];
                    if (list) {
                        while (list.firstChild) {
                            list.removeChild(list.firstChild);
                        }
                        list.hidden = true;
                    }
                    setStatus('Unable to load bookings. Please try again.', true);
                });
            }

            function saveBookingStatus(bookingId, select, button) {
                var nextStatus = allowedStatus(select.value);
                if (nextStatus === 'cancelled') {
                    var confirmed = window.confirm('Cancel this booking request?');
                    if (!confirmed) {
                        return;
                    }
                }
                select.disabled = true;
                button.disabled = true;
                fetch('/api/admin/bookings/' + String(bookingId), {
                    method: 'PATCH',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: nextStatus })
                }).then(function (res) {
                    if (res.status === 401) {
                        window.location.replace('/admin');
                        return null;
                    }
                    if (!res.ok) {
                        throw new Error('save-failed');
                    }
                    return res.json();
                }).then(function (data) {
                    if (!data) return;
                    if (!data.ok || !data.status) {
                        throw new Error('save-failed');
                    }
                    return loadBookings('Booking ' + String(data.id) + ' updated to ' + String(data.status) + '.');
                }).catch(function () {
                    select.disabled = false;
                    button.disabled = false;
                    setStatus('Unable to update booking. Please try again.', true);
                });
            }

            if (filtersForm) {
                filtersForm.addEventListener('submit', function (event) {
                    event.preventDefault();
                    applyFilters();
                });
            }
            if (searchInput) {
                searchInput.addEventListener('input', applyFilters);
            }
            if (statusFilter) {
                statusFilter.addEventListener('change', applyFilters);
            }
            if (dateFieldFilter) {
                dateFieldFilter.addEventListener('change', applyFilters);
            }
            if (dateFilter) {
                dateFilter.addEventListener('change', applyFilters);
            }

            if (logout) {
                logout.addEventListener('click', function () {
                    logout.disabled = true;
                    setStatus('Signing out…');
                    fetch('/api/admin/logout', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' }
                    }).then(function () {
                        window.location.replace('/admin');
                    }).catch(function () {
                        logout.disabled = false;
                        setStatus('Unable to sign out. Please try again.', true);
                    });
                });
            }

            loadBookings();
        })();
    </script>
</body>
</html>
